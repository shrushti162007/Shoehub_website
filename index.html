<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShoeHub</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f5f5f5}header{height:60px;background:white;display:flex;align-items:center;gap:10px;padding:8px 5%;position:sticky;top:0;z-index:5}.logo{font-size:21px;font-weight:bold;color:#d71920}.search{flex:1;padding:9px;border:1px solid #ddd;border-radius:20px}header button{border:0;background:white;font-size:20px}.hero{height:230px;padding:45px 7%;color:white;background:linear-gradient(90deg,#550006,#ed001c)}.hero h1{font-size:32px;margin:5px 0}.hero p{font-size:12px}.hero button,.banner button{padding:10px 16px;border:0;border-radius:20px;font-weight:bold}section{padding:20px 5%}h2{font-size:20px}.cats{display:flex;gap:8px;overflow:auto}.cat{min-width:80px;border:0;background:white;border-radius:10px;padding:5px;font-weight:bold}.cat img{width:70px;height:55px;object-fit:cover;border-radius:8px}.cat small{font-size:10px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:white;border-radius:12px;overflow:hidden;position:relative}.card img{width:100%;height:150px;object-fit:cover}.info{padding:9px}.info h3{margin:5px 0}.price{color:#d71920;font-weight:bold}.heart{position:absolute;right:6px;top:6px;border:0;border-radius:50%;background:white;font-size:18px}.add{width:100%;background:#111;color:white;border:0;padding:8px;border-radius:8px}.banner{margin:15px 5%;padding:25px;background:#111;color:white;text-align:center;border-radius:15px}footer{background:#111;color:white;padding:25px 5%}@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
<div class="logo">ShoeHub</div>
<input class="search" id="q" placeholder="Search shoes..." oninput="show()">
<button onclick="alert('Wishlist ❤️')">♡</button>
<button onclick="cart()">🛒<sup id="n">0</sup></button>
</header>

<div class="hero">
<h1>Step Into Your Style</h1>
<p>Discover footwear for every mood, move and moment.</p>
<button onclick="filter('All')">Shop Collection</button>
</div>

<section>
<h2>Shop By Category</h2>
<div class="cats">
<button class="cat" onclick="filter('Running')"><img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=200"><small>Running</small></button>
<button class="cat" onclick="filter('Sneakers')"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200"><small>Sneakers</small></button>
<button class="cat" onclick="filter('Sports')"><img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?w=200"><small>Sports</small></button>
<button class="cat" onclick="filter('Casual')"><img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=200"><small>Casual</small></button>
<button class="cat" onclick="filter('Formal')"><img src="https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=200"><small>Formal</small></button>
</div>
</section>

<section>
<h2 id="title">All Shoes</h2>
<div class="products" id="products"></div>
</section>

<div class="banner">
<h2>Step Into 30% OFF</h2>
<p>Use code STEP30</p>
<button onclick="filter('All')">Shop Now</button>
</div>

<footer>
<h2>ShoeHub 👟</h2>
<p>Premium footwear for every step.</p>
<p>SY Computer Science Field Project • 2026</p>
</footer>

<script>
let d=[
["Air Max","Sneakers",4299,"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"],
["Runner Pro","Running",5999,"https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=500"],
["Street Sport","Sports",4799,"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"],
["Urban Classic","Casual",2999,"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500"],
["Classic Derby","Formal",5299,"https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=500"],
["Street White","Sneakers",3899,"https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=500"],
["Speed Runner","Running",4499,"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=500"],
["Court Max","Sports",5199,"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500"]
],cat="All",bag=[];

function filter(x){cat=x;show()}
function show(){
let q=document.getElementById("q").value.toLowerCase();
let a=d.filter(x=>(cat=="All"||x[1]==cat)&&x[0].toLowerCase().includes(q));
document.getElementById("title").innerText=cat=="All"?"All Shoes":cat+" Shoes";
document.getElementById("products").innerHTML=a.map(x=>`<div class="card"><button class="heart">♡</button><img src="${x[3]}"><div class="info"><small>${x[1]}</small><h3>${x[0]}</h3>⭐ 4.8<p class="price">₹${x[2]}</p><button class="add" onclick="add('${x[0]}')">Add to Cart</button></div></div>`).join("")
}
function add(x){bag.push(x);n.innerText=bag.length;alert(x+" added 🛒")}
function cart(){alert(bag.length?bag.join(", ")+"\n\nOrder placed successfully! 🎉":"Cart is empty")}
show();
</script>
</body>
</html>
