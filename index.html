<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShoeHub | Step Into Style</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f7f7f7;
  color:#171717;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#111;
  color:white;
  padding:17px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 20px rgba(0,0,0,.2);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#ff4d00;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
  transition:.3s;
}

nav a:hover{
  color:#ff4d00;
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.header-icon{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:18px;
  position:relative;
}

.header-icon:hover{
  background:#ff4d00;
}

.cart-count{
  position:absolute;
  top:-4px;
  right:-3px;
  background:#ff4d00;
  color:white;
  width:19px;
  height:19px;
  border-radius:50%;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* ================= HERO ================= */

.hero{
  min-height:590px;
  display:flex;
  align-items:center;
  padding:80px 7%;
  color:white;
  background:
    linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.3)),
    url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1800&q=90")
    center/cover;
}

.hero-content{
  max-width:650px;
}

.hero-tag{
  display:inline-block;
  background:#ff4d00;
  padding:8px 15px;
  border-radius:30px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:20px;
  letter-spacing:1px;
}

.hero h1{
  font-size:68px;
  line-height:1;
  margin-bottom:22px;
  font-weight:900;
}

.hero h1 span{
  color:#ff5a00;
}

.hero p{
  color:#ddd;
  font-size:19px;
  line-height:1.6;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:15px 28px;
  border-radius:30px;
  font-weight:bold;
  background:#ff4d00;
  color:white;
  transition:.3s;
}

.btn:hover{
  transform:translateY(-3px);
  background:#e64100;
}

.btn-outline{
  background:transparent;
  border:1px solid white;
}

.btn-outline:hover{
  background:white;
  color:#111;
}

/* ================= FEATURES ================= */

.features{
  background:white;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:25px 7%;
  gap:20px;
  border-bottom:1px solid #eee;
}

.feature{
  display:flex;
  align-items:center;
  gap:13px;
}

.feature-icon{
  font-size:27px;
}

.feature h4{
  font-size:14px;
  margin-bottom:4px;
}

.feature p{
  font-size:12px;
  color:#777;
}

/* ================= GENERAL ================= */

.section{
  padding:75px 6%;
}

.section-heading{
  text-align:center;
  margin-bottom:40px;
}

.section-heading h2{
  font-size:36px;
  margin-bottom:9px;
}

.section-heading p{
  color:#777;
}

/* ================= CATEGORIES ================= */

.categories{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.category{
  height:190px;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  cursor:pointer;
}

.category img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.category:hover img{
  transform:scale(1.08);
}

.category-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent,rgba(0,0,0,.8));
  display:flex;
  align-items:flex-end;
  padding:20px;
  color:white;
}

.category-overlay h3{
  font-size:20px;
}

/* ================= SHOP TOOLBAR ================= */

.shop-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

.search{
  flex:1;
  min-width:240px;
  padding:15px 20px;
  border:1px solid #ddd;
  border-radius:30px;
  background:white;
  outline:none;
}

.search:focus{
  border-color:#ff4d00;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter{
  padding:11px 16px;
  border:1px solid #ddd;
  background:white;
  border-radius:25px;
  font-weight:bold;
  font-size:13px;
}

.filter.active,
.filter:hover{
  background:#111;
  color:white;
}

.sort{
  padding:12px 16px;
  border:1px solid #ddd;
  border-radius:25px;
  background:white;
  outline:none;
}

/* ================= PRODUCTS ================= */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
  transition:.3s;
}

.card:hover{
  transform:translateY(-7px);
  box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.product-image{
  height:245px;
  background:#eee;
  position:relative;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.card:hover .product-image img{
  transform:scale(1.06);
}

.badge{
  position:absolute;
  top:13px;
  left:13px;
  background:#ff4d00;
  color:white;
  padding:6px 10px;
  border-radius:15px;
  font-size:10px;
  font-weight:bold;
  z-index:2;
