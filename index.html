<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShoeHub | Step Into Style</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080909;color:#fff}button,input,select{font:inherit}header{height:70px;background:#090a0a;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:900}.logo b{color:#39e58c}nav a{color:#aaa;text-decoration:none;margin:0 12px}.cart{border:1px solid #333;background:#111;color:white;border-radius:20px;padding:9px 15px;cursor:pointer}.cart b{color:#39e58c}.hero{min-height:390px;padding:60px 7%;display:flex;align-items:center;justify-content:space-between;background:radial-gradient(circle at 80%,#173c2b,#080909 45%)}.hero h1{font-size:clamp(45px,8vw,85px);margin:0;line-height:.9}.hero p{color:#aaa;font-size:18px}.hero img{width:min(43vw,430px);filter:drop-shadow(0 25px 20px #000);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-15px) rotate(-3deg)}}.go{background:#39e58c;border:0;padding:13px 24px;border-radius:25px;font-weight:bold;cursor:pointer}.bar{padding:28px 6%;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar input{margin-left:auto;padding:12px 17px;border-radius:22px;border:1px solid #333;background:#111;color:#fff;width:230px}.filters button{background:#151616;color:#aaa;border:1px solid #333;padding:9px 15px;border-radius:20px;cursor:pointer}.filters .on{background:#39e58c;color:#000}.grid{padding:0 6% 60px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#111313;border:1px solid #222;border-radius:18px;padding:13px;position:relative;transition:.3s}.card:hover{transform:translateY(-7px);border-color:#39e58c}.pic{height:190px;background:#181a19;border-radius:14px;display:grid;place-items:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;transition:.4s}.card:hover img{transform:scale(1.08) rotate(-3deg)}.heart{position:absolute;right:22px;top:22px;background:#000b;color:white;border:0;border-radius:50%;font-size:20px;cursor:pointer}.card h3{margin:12px 0 5px}.brand{color:#777;font-size:13px}.price{font-weight:bold;font-size:18px;margin:8px 0}.add{width:100%;padding:11px;border:0;border-radius:10px;background:#39e58c;font-weight:bold;cursor:pointer}.drawer,.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none}.drawer>div{position:absolute;right:0;top:0;height:100%;width:min(420px,100%);background:#101212;padding:25px;overflow:auto}.modal{place-items:center}.modal>div{background:#121414;border:1px solid #333;border-radius:20px;padding:25px;width:min(430px,92%)}.modal input,.modal select{width:100%;margin:7px 0;padding:12px;border-radius:9px;border:1px solid #333;background:#080909;color:white}.close{float:right;background:none;border:0;color:#aaa;font-size:25px}.item{display:flex;gap:10px;border-bottom:1px solid #292929;padding:12px 0}.item img{width:65px;height:55px;object-fit:contain;background:#181818;border-radius:8px}.qty button{background:#222;color:white;border:0;padding:4px 9px}.total{font-size:20px;margin:20px 0}.fly{position:fixed;z-index:99;width:80px;height:80px;object-fit:contain;pointer-events:none;animation:fly .7s ease forwards}@keyframes fly{to{transform:translate(calc(90vw - var(--x)),calc(-85vh - var(--y))) scale(.1);opacity:.2}}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#39e58c;color:#000;padding:13px 20px;border-radius:25px;font-weight:bold;z-index:100;display:none}footer{text-align:center;padding:35px;color:#777;border-top:1px solid #222}footer b{color:#39e58c}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero img{width:38vw}nav{display:none}}@media(max-width:550px){.hero{padding:45px 6%;min-height:330px}.hero img{width:42vw}.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 4% 40px}.pic{height:145px}.card{padding:9px}.bar{padding:20px 4%}.bar input{width:100%;margin:5px 0}.filters{width:100%;overflow:auto;white-space:nowrap}.hero h1{font-size:48px}}
</style></head><body>
<header><div class="logo">Shoe<b>Hub</b></div><nav><a href="#shop">Shop</a><a href="#about">About</a></nav><button class="cart" onclick="openCart()">🛒 Cart <b id="count">0</b></button></header>
<section class="hero"><div><p>PREMIUM FOOTWEAR</p><h1>STEP<br>INTO<br>STYLE.</h1><p>Find your next favourite pair.</p><button class="go" onclick="document.getElementById('shop').scrollIntoView()">SHOP NOW →</button></div><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=80"></section>
<section class="bar" id="shop"><div class="filters"><button class="on" onclick="filter('All',this)">All</button><button onclick="filter('Sneakers',this)">Sneakers</button><button onclick="filter('Sports',this)">Sports</button><button onclick="filter('Street',this)">Street</button><button onclick="filter('Casual',this)">Casual</button></div><input id="search" placeholder="🔎 Search shoes..." oninput="render()"></section>
<main class="grid" id="products"></main>
<section id="about" style="padding:40px 7%;text-align:center"><h2>Why ShoeHub?</h2><p style="color:#999">A modern online shoe shopping experience built with HTML, CSS & JavaScript.</p></section>
<footer>© 2026 ShoeHub · <b>Designed & Developed by Shrushti Pawar</b></footer>

<div class="drawer" id="drawer"><div><button class="close" onclick="closeCart()">×</button><h2>🛒 Your Cart</h2><div id="cart"></div><div class="total">Total: ₹<b id="total">0</b></div><button class="go" style="width:100%" onclick="checkout()">CHECKOUT →</button></div></div>

<div class="modal" id="modal"><div><button class="close" onclick="closeModal()">×</button><h2>Checkout</h2><input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone Number"><input id="email" placeholder="Email"><input id="address" placeholder="Delivery Address"><select id="pay"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><button class="go" style="width:100%;margin-top:10px" onclick="placeOrder()">PLACE ORDER</button></div></div>
<div class="toast" id="toast"></div>
<script>
const P=[
['Air Nova X','Nike Style','Sneakers',4999,'1542291026-7eec264c27ff'],
['Ultra Flow','Adidas Style','Sports',5999,'1600185365483-26d7a4cc7519'],
['RS Street Pro','Puma Style','Street',4299,'1551107696-a4b0c5a0d9a2'],
['574 Urban','NB Style','Sneakers',3899,'1495555961986-6d4c1ecb7be3'],
['Old Skool Edge','Vans Style','Street',3499,'1525966222134-fcfa99b8ae77'],
['Chuck Motion','Converse Style','Casual',3299,'1556048219-bb6978360b84'],
['Velocity Max','ShoeHub Sport','Sports',4599,'1460353581641-37baddab0fa2'],
['Shadow Runner','ASICS Style','Sports',5299,'1515955656352-a1fa3ffcd111'],
['Court Classic','Premium Edit','Sneakers',4199,'1494496195158-c3becb4f2475'],
['Urban Force','StreetLab','Street',3799,'1549298916-b41d501d3772'],
['Cloud Step','ShoeHub','Casual',2999,'1543508282-6319a3e2621f'],
['Retro Flame','Premium Edit','Casual',3599,'1552346154-21d32810aba3']
];
let cart=JSON.parse(localStorage.cart||'[]'),cat='All';
const url=id=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=600&q=80`;
function render(){let q=document.getElementById('search').value.toLowerCase(),a=P.filter(x=>(cat=='All'||x[2]==cat)&&x[0].toLowerCase().includes(q));products.innerHTML=a.map((x,i)=>`<article class="card"><button class="heart" onclick="wish(this)">♡</button><div class="pic"><img src="${url(x[4])}"></div><span class="brand">${x[1]}</span><h3>${x[0]}</h3><div class="price">₹${x[3]}</div><button class="add" onclick="add(${P.indexOf(x)},this)">ADD TO CART</button></article>`).join('')}
function filter(x,b){cat=x;document.querySelectorAll('.filters button').forEach(a=>a.classList.remove('on'));b.classList.add('on');render()}
function wish(b){b.innerText=b.innerText=='♡'?'♥':'♡';toast(b.innerText=='♥'?'Added to wishlist':'Removed from wishlist')}
function add(i,b){cart.push(i);localStorage.cart=JSON.stringify(cart);update();let im=b.parentElement.querySelector('img'),f=im.cloneNode();f.className='fly';f.style.left=im.getBoundingClientRect().left+'px';f.style.top=im.getBoundingClientRect().top+'px';f.style.setProperty('--x',im.getBoundingClientRect().left+'px');f.style.setProperty('--y',im.getBoundingClientRect().top+'px');document.body.append(f);setTimeout(()=>f.remove(),700);toast('✓ Added to cart')}
function update(){count.innerText=cart.length;let n=0;cart.forEach(i=>n+=P[i][3]);total.innerText=n}
function openCart(){drawer.style.display='block';showCart()}
function closeCart(){drawer.style.display='none'}
function showCart(){let c={};cart.forEach(i=>c[i]=(c[i]||0)+1);cart.innerHTML=Object.keys(c).map(i=>`<div class="item"><img src="${url(P[i][4])}"><div><b>${P[i][0]}</b><br>₹${P[i][3]} × ${c[i]}<br><span class="qty"><button onclick="change(${i},-1)">−</button> <button onclick="change(${i},1)">+</button></span></div></div>`).join('')||'<p style="color:#888">Your cart is empty.</p>'}
function change(i,n){if(n>0)cart.push(i);else{let k=cart.indexOf(i);if(k>-1)cart.splice(k,1)}localStorage.cart=JSON.stringify(cart);update();showCart()}
function checkout(){if(!cart.length)return toast('Cart is empty');modal.style.display='grid'}
function closeModal(){modal.style.display='none'}
function placeOrder(){let n=document.getElementById('name').value.trim(),p=document.getElementById('phone').value.trim(),e=document.getElementById('email').value.trim(),a=document.getElementById('address').value.trim();if(!n||p.length<10||!e||!a)return toast('Please fill all details');let id='SH'+Math.floor(100000+Math.random()*900000);closeModal();closeCart();cart=[];localStorage.cart='[]';update();alert('🎉 ORDER PLACED!\\nOrder ID: '+id+'\\nThank you for shopping with ShoeHub!')}
function toast(t){let x=document.getElementById('toast');x.innerText=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
render();update();
</script></body></html>
