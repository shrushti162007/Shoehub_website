<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShoeHub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f7f7;color:#161616}
header{background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px #0002}
.nav{max-width:1200px;margin:auto;height:68px;display:flex;align-items:center;gap:18px;padding:10px 16px}
.logo{font-size:28px;font-weight:900;color:#e53935}.logo span{color:#111}
.search{display:flex;flex:1;background:#f2f2f2;border-radius:25px;overflow:hidden;border:1px solid #ddd}
.search input{flex:1;border:0;background:transparent;padding:13px 18px;outline:0}
.search button{border:0;background:#e53935;color:#fff;padding:0 20px}
.bag{border:0;background:white;font-size:22px;position:relative;cursor:pointer}
.count{position:absolute;background:#e53935;color:#fff;border-radius:50%;font-size:10px;padding:3px 6px;top:-8px;right:-8px}

.hero{height:430px;background:linear-gradient(90deg,#000b,#0001),url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1500&q=90") center/cover;display:flex;align-items:center}
.heroText{max-width:1200px;width:100%;margin:auto;padding:25px;color:#fff}
.hero h1{font-size:56px;max-width:600px}
.hero p{font-size:19px;margin:15px 0 25px}
.hero button{background:#e53935;color:#fff;border:0;padding:14px 25px;border-radius:25px;font-weight:bold;cursor:pointer}

.wrap{max-width:1200px;margin:auto;padding:35px 16px}
.title{font-size:27px;margin-bottom:20px}
.cats{display:flex;gap:13px;overflow-x:auto}
.cat{min-width:145px;height:145px;border-radius:15px;overflow:hidden;position:relative;cursor:pointer}
.cat img{width:100%;height:100%;object-fit:cover}
.cat b{position:absolute;bottom:0;left:0;right:0;padding:22px 5px 10px;text-align:center;color:#fff;background:linear-gradient(transparent,#000b)}

.tools{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
.tools input,.tools select{padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff}

.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 15px #0001;transition:.2s}
.card:hover{transform:translateY(-4px)}
.pic{height:215px;background:#eee;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.heart{position:absolute;right:10px;top:10px;border:0;border-radius:50%;background:#fff;width:35px;height:35px;font-size:19px;cursor:pointer}
.info{padding:14px}
.brand{font-size:12px;color:#777;font-weight:bold}
.info h3{font-size:16px;margin:5px 0}
.rating{color:#e9a400;font-size:13px}
.price{font-size:19px;font-weight:bold;margin:8px 0}
.old{text-decoration:line-through;color:#999;font-size:12px;margin-left:5px}
.off{color:#159447;font-size:12px;margin-left:5px}
.add{width:100%;padding:11px;border:0;border-radius:8px;background:#111;color:white;font-weight:bold;margin-top:5px;cursor:pointer}
.details{background:#eee;color:#111}

.trend{display:flex;gap:15px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:10px}
.trend .card{min-width:250px}

.overlay,.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50}
.drawer{background:#fff;width:min(430px,100%);height:100%;margin-left:auto;padding:22px;overflow:auto}
.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}
.cartItem{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #ddd;align-items:center}
.cartItem img{width:85px;height:75px;object-fit:cover;border-radius:10px}
.cartInfo{flex:1}.cartInfo small{color:#777}.cartInfo h3{font-size:15px;margin:4px 0}
.cartPrice{font-weight:bold;font-size:16px}
.cartQty{display:flex;align-items:center;gap:7px;margin-top:7px}
.cartQty button{border:1px solid #ccc;background:#fff;border-radius:5px;padding:3px 9px;cursor:pointer}
.remove{border:0!important;color:#e53935;background:none!important;padding:0!important;font-size:12px;cursor:pointer}
.total{font-size:22px;font-weight:bold;margin:20px 0}
.order{width:100%;padding:14px;background:#e53935;color:#fff;border:0;border-radius:9px;font-weight:bold;font-size:16px;cursor:pointer}

.modal{align-items:center;justify-content:center;padding:15px}
.modalBox{background:#fff;border-radius:18px;padding:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto}
.detail{display:flex;gap:20px}
.detail img{width:48%;height:300px;object-fit:cover;border-radius:12px}
.detailText{flex:1}.detailText h2{margin:10px 0}
.sizes button,.colors button{padding:8px 13px;margin:4px;background:#fff;border:1px solid #bbb;border-radius:6px;cursor:pointer}
.buy{width:100%;padding:13px;background:#111;color:#fff;border:0;border-radius:8px;margin-top:12px;cursor:pointer}

footer{background:#111;color:#ddd;text-align:center;padding:35px;margin-top:40px}
footer b{color:#fff}

@media(max-width:850px){
.products{grid-template-columns:repeat(2,1fr)}
.hero h1{font-size:42px}
}
@media(max-width:520px){
.nav{gap:8px}.logo{font-size:22px}
.products{gap:10px}.pic{height:155px}
.info{padding:9px}.info h3{font-size:14px}
.hero{height:370px}.hero h1{font-size:35px}
.detail{flex-direction:column}.detail img{width:100%;height:230px}
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">Shoe<span>Hub</span></div>
<div class="search">
<input id="search" placeholder="Search shoes, brands...">
<button onclick="render()">⌕</button>
</div>
<button class="bag" onclick="openCart()">🛍️<i class="count" id="count">0</i></button>
</div>
</header>

<section class="hero">
<div class="heroText">
<h1>Step Into Your Style</h1>
<p>Discover footwear for every mood, move and moment.</p>
<button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">Shop Collection →</button>
</div>
</section>

<div class="wrap">

<h2 class="title">Shop By Category</h2>
<div class="cats" id="cats"></div>

<section id="shop">
<h2 class="title" style="margin-top:40px">All Shoes</h2>

<div class="tools">
<select id="filter" onchange="render()">
<option value="">All Categories</option>
</select>

<select id="sort" onchange="render()">
<option value="">Sort By</option>
<option value="low">Price Low → High</option>
<option value="high">Price High → Low</option>
<option value="rating">Top Rated</option>
</select>
</div>

<div class="products" id="products"></div>
</section>

<h2 class="title" style="margin-top:45px">Trending Now</h2>
<div class="trend" id="trend"></div>

</div>

<div class="overlay" id="cartBox">
<div class="drawer">
<button class="close" onclick="closeCart()">×</button>
<h2>Your Shopping Bag</h2>
<div id="cart"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<button class="order" onclick="placeOrder()">Place Order</button>
</div>
</div>

<div class="modal" id="modal">
<div class="modalBox">
<button class="close" onclick="closeModal()">×</button>
<div id="details"></div>
</div>
</div>

<footer>
<b>ShoeHub</b>
<p>Your style. Your step. Your choice.</p>
<p>📞 +91 76203 43907</p>
<p>Designed & Developed by <b>Shrushti Pawar</b></p>
</footer>

<script>

const I=[

"https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1560769629-975ec94e6a86?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1556637640-2c80d3201be8?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1543508282-6319a3e2621f?auto=format&fit=crop&w=700&q=80",

"https://images.unsplash.com/photo-1518002171953-66a942e2a1c5?auto=format&fit=crop&w=700&q=80"

];

const FALLBACK=I[0];

const P=[

["Nike","Air Max 270","Running",8999,11999,4.8],
["Nike","Revolution Runner","Running",4299,5999,4.5],
["Adidas","Ultraboost Runner","Running",9999,13999,4.9],
["Puma","Velocity Nitro","Running",7499,9999,4.7],
["New Balance","Fresh Foam","Running",6799,8499,4.6],
["Asics","Gel Contend","Running",5299,6999,4.5],

["Nike","Dunk Low","Sneakers",8499,10999,4.8],
["Adidas","Forum Street","Sneakers",6299,7999,4.6],
["Puma","Suede Classic","Sneakers",4999,6499,4.7],
["New Balance","550 Classic","Sneakers",7999,9999,4.8],
["Reebok","Club C 85","Sneakers",4599,5999,4.5],

["Nike","Court Vision","Sports",4799,6499,4.5],
["Adidas","Runfalcon Sport","Sports",3999,5499,4.4],
["Puma","Court Rider","Sports",5999,7999,4.6],
["Reebok","Flexagon Force","Sports",4299,5799,4.5],

["Skechers","Go Walk Comfort","Walking",4499,5999,4.7],
["Skechers","Summits","Walking",3999,5499,4.6],
["Adidas","Cloudfoam Walk","Walking",4299,5799,4.6],
["Puma","SoftRide Walk","Walking",3699,4999,4.4],

["Nike","Everyday Casual","Casual",3999,5299,4.5],
["Puma","Caven Street","Casual",4499,5999,4.6],
["Adidas","Grand Court","Casual",4299,5799,4.7],
["Reebok","Royal Complete","Casual",3899,5199,4.4],

["Nike","Air Jordan Street","Basketball",8999,11999,4.9],
["Nike","Court Mid","Basketball",6999,8999,4.7],
["Adidas","Hoops 3.0","Basketball",5499,7499,4.6],
["Puma","Rise Basketball","Basketball",5999,7999,4.7],

["Nike","Metcon Trainer","Training",8499,10999,4.8],
["Adidas","Dropset Trainer","Training",7499,9499,4.7],
["Puma","Fuse Training","Training",6499,8499,4.6],
["Reebok","Nano Training","Training",7999,9999,4.8]

];

const catImg={
Running:I[0],
Sneakers:I[1],
Sports:I[2],
Walking:I[3],
Casual:I[4],
Basketball:I[5],
Training:I[6]
};

let cart=[];

function img(url){
return url+'\" onerror=\"this.onerror=null;this.src=\''+FALLBACK+'\'';
}

function setup(){

let c=[...new Set(P.map(x=>x[2]))];

cats.innerHTML=c.map(x=>`
<div class="cat" onclick="choose('${x}')">
<img src="${img(catImg[x])}">
<b>${x}</b>
</div>`).join("");

filter.innerHTML='<option value="">All Categories</option>'+
c.map(x=>`<option>${x}</option>`).join("");

}

function choose(x){
filter.value=x;
render();
shop.scrollIntoView({behavior:"smooth"});
}

function card(p){

let off=Math.round((1-p[3]/p[4])*100);

return `
<div class="card">

<div class="pic">
<img src="${img(I[p.i%I.length])}">
<button class="heart" onclick="this.innerText=this.innerText=='♡'?'♥':'♡'">♡</button>
</div>

<div class="info">

<small class="brand">${p[0]} · ${p[2]}</small>

<h3>${p[1]}</h3>

<div class="rating">★ ${p[5]} · 120+ reviews</div>

<div class="price">
₹${p[3].toLocaleString()}
<span class="old">₹${p[4].toLocaleString()}</span>
<span class="off">${off}% OFF</span>
</div>

<button class="add" onclick="add(${p.i})">Add to Bag</button>

<button class="add details" onclick="details(${p.i})">View Details</button>

</div>
</div>`;
}

function render(){

let q=search.value.toLowerCase();
let f=filter.value;
let s=sort.value;

let a=P.map((p,i)=>({...p,i}))
.filter(p=>
(!q||(p[0]+" "+p[1]+" "+p[2]).toLowerCase().includes(q))
&&(!f||p[2]==f)
);

if(s=="low")a.sort((a,b)=>a[3]-b[3]);
if(s=="high")a.sort((a,b)=>b[3]-a[3]);
if(s=="rating")a.sort((a,b)=>b[5]-a[5]);

products.innerHTML=a.map(card).join("");

trend.innerHTML=P.slice(0,12).map((p,i)=>card({...p,i})).join("");

}

function add(i){

cart.push(i);
update();

alert(P[i][1]+" added to your bag!");

}

function update(){

count.innerText=cart.length;

let total=0;

cart.innerHTML=cart.map((i,n)=>{

let p=P[i];

total+=p[3];

return `
<div class="cartItem">

<img src="${img(I[i%I.length])}">

<div class="cartInfo">

<small>${p[0]} · ${p[2]}</small>

<h3>${p[1]}</h3>

<div class="cartPrice">
₹${p[3].toLocaleString()}
</div>

<div class="cartQty">

<button onclick="removeOne(${n})">−</button>

<span>1</span>

<button onclick="cart.push(${i});update()">+</button>

</div>

<button class="remove" onclick="removeOne(${n})">
Remove
</button>

</div>

</div>
`;

}).join("")||"<p>Your bag is empty.</p>";

totalPrice.innerText=total.toLocaleString();

}

function removeOne(n){

cart.splice(n,1);
update();

}

function openCart(){
cartBox.style.display="block";
}

function closeCart(){
cartBox.style.display="none";
}

function details(i){

let p=P[i];

document.getElementById("details").innerHTML=`

<div class="detail">

<img src="${img(I[i%I.length])}">

<div class="detailText">

<small>${p[0]} · ${p[2]}</small>

<h2>${p[1]}</h2>

<div class="rating">★ ${p[5]} Excellent Rating</div>

<h2>₹${p[3].toLocaleString()}</h2>

<p>Comfortable premium footwear made for style and everyday performance.</p>

<h4>Choose Size</h4>

<div class="sizes">
<button>6</button>
<button>7</button>
<button>8</button>
<button>9</button>
<button>10</button>
</div>

<h4>Choose Color</h4>

<div class="colors">
<button>Black</button>
<button>White</button>
<button>Blue</button>
<button>Grey</button>
</div>

<button class="buy" onclick="add(${i});closeModal()">
Add To Bag
</button>

</div>
</div>`;

modal.style.display="flex";

}

function closeModal(){
modal.style.display="none";
}

function placeOrder(){

if(!cart.length){
alert("Your bag is empty!");
return;
}

cart=[];

update();

closeCart();

alert("🎉 Order placed successfully! Thank you for shopping with ShoeHub.");

}

setup();
render();
update();

</script>

</body>
  </html>
